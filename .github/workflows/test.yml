name: Test

# Kept out of the 15-minute schedule check so that stays fast.
on:
  push:
    branches: [main]
    paths-ignore: [data/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
