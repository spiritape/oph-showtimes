name: Update schedule

on:
  schedule:
    - cron: "*/15 * * * *" # check every 15 minutes; deploys only when something changed
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check the schedule
        id: build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          # Starting a run by hand always republishes.
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Deploy to Cloudflare Pages
        if: steps.build.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT || 'oph-showtimes' }} --branch=main

      - name: Save seen Titles
        if: steps.build.outputs.publish == 'true'
        run: |
          git config user.name "oph-showtimes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen Titles"
            git push
          fi

      - name: Report a failed update
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_STEP: ${{ steps.build.outcome == 'failure' && 'Reading the Playhouse schedule' || 'Deploying or saving state' }}
        run: |
          if [ -z "$(gh issue list --label update-failed --state open --json number --jq '.[].number')" ]; then
            gh label create update-failed --color B60205 --force
            gh issue create --label update-failed \
              --title "Scheduled update failed" \
              --body "$FAILED_STEP failed. If reading failed, nothing was deployed (see docs/adr/0001). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
