name: Update schedule

on:
  # The watcher Worker starts this within ~2 minutes of a change (docs/adr/0002).
  # GitHub's own schedule is only a fallback in case the watcher stops.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Republish even if the schedule hasn't changed
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check the schedule
        id: build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          WATCHER_URL: ${{ vars.WATCHER_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          # Starting a run by hand republishes; the watcher's runs don't need to.
          FORCE_PUBLISH: ${{ inputs.force && '1' || '' }}

      - name: Deploy to Cloudflare Pages
        if: steps.build.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT || 'oph-showtimes' }} --branch=main

      - name: Save seen Titles
        if: steps.build.outputs.publish == 'true'
        run: |
          git config user.name "oph-showtimes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen Titles"
            git push
          fi

      # Sent after deploy so the link works, and after saving state so a
      # failure can never make the next run send the same notification twice.
      - name: Send New Title Notification
        if: steps.build.outputs.publish == 'true'
        run: npx tsx src/send-notification.ts
        env:
          WATCHER_URL: ${{ vars.WATCHER_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}

      - name: Report a held notification
        if: steps.build.outputs.notification_held != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HELD: ${{ steps.build.outputs.notification_held }}
        run: |
          gh label create notification-held --color FBCA04 --force
          gh issue create --label notification-held \
            --title "New Title Notification held back" \
            --body "The site was published, but no notification was sent because this looked like a misread: $HELD"

      - name: Report a failed update
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_STEP: ${{ steps.build.outcome == 'failure' && 'Reading the Playhouse schedule' || 'Deploying or saving state' }}
        run: |
          if [ -z "$(gh issue list --label update-failed --state open --json number --jq '.[].number')" ]; then
            gh label create update-failed --color B60205 --force
            gh issue create --label update-failed \
              --title "Scheduled update failed" \
              --body "$FAILED_STEP failed. If reading failed, nothing was deployed (see docs/adr/0001). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
