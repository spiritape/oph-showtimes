ists tried to counter Russian propaganda and report the truth on the war, until all independent media was shut down and they were forced to flee the country. Structured in five chapters, feeling like a cross between a Russian novel and a reality show about frighteningly real reality, Loktev’s film is an extraordinary historic record of a country on the verge of fascism and an immersive and intimate inside view of the opposition in an authoritarian society, which becomes all the more globally relevant every day.\u003C/p>",{"__typename":9,"id":429,"fileName":430,"url":431},"cmsqfh8cp7b0807n7t8r1v0n0","MUF 1 1280x770_SQ.jpg","https://us-west-2.graphassets.com/AjQ6YhqDQQuKSCpFHmA5az/cmsqfh8cp7b0907n7il9s2bnm","my-undesirable-friends-part-1-last-air-in-moscow-chapters-1-3",{"__typename":54,"slug":55},"Ojai Playhouse - Films - My Undesirable Friends: Part 1 - Last Air in Moscow (Chapters 1-3)",{"__typename":36,"id":436,"title":344,"buyTicketsLink":437,"freeScreeningLink":40,"freeEventLink":40,"subtitle":40,"performerInformation":438,"livestreamLink":40,"eventDate":439,"additionalNotes":440,"eventInformation":441,"image":442,"slug":446,"eventCategory":447,"metaDescription":344,"metaTitle":358},"cmu7fjkv4m7sp07mzm77rtn75","https://ticketing.uswest.veezi.com/purchase/1139?siteToken=0zv2d2xep31txszrx28cn3r0t4",{"__typename":21,"html":42},"2026-10-11T23:15:00+00:00",{"__typename":21,"html":45},{"__typename":21,"html":350},{"__typename":9,"id":443,"fileName":444,"url":445},"cmu7eo077ksl907mzwgpcqe0s","Naza 2 1280x770_SQ.jpg","https://us-west-2.graphassets.com/AjQ6YhqDQQuKSCpFHmA5az/cmu7eo077ksla07mzbkuf1npw","naza2",{"__typename":54,"slug":55},{"__typename":36,"id":449,"title":141,"buyTicketsLink":450,"freeScreeningLink":40,"freeEventLink":40,"subtitle":40,"performerInformation":451,"livestreamLink":40,"eventDate":452,"additionalNotes":453,"eventInformation":454,"image":175,"slug":455,"eventCategory":456,"metaDescription":141,"metaTitle":154},"cmucy67qeo8i107lkyj0nlhjx","https: 7lnml92o87o","The Disciple: A Wu-Tang Fable","https://ticketing.uswest.veezi.com/purchase/1160?siteToken=0zv2d2xep31txszrx28cn3r0t4",{"__typename":21,"html":42},"2026-10-16T02:15:00+00:00",{"__typename":21,"html":45},{"__typename":21,"html":490},"\u003Cp>Year: 2026\u003Cbr>Director: Joanna Natasegara\u003Cbr>Starring: Cilvaringz, The RZA\u003Cbr>Running Time: 1hr 45min\u003C/p>\u003Cp>\u003Cstrong>Theatrical sneak peek!\u003C/strong>\u003C/p>\u003Cp>A driven outsider penetrates Wu-Tang Clan&#39;s inner circle, channeling his ambition and creativity into an album that&#39;s about to spark worldwide controversy.\u003C/p>\u003Cp>Wu-Tang Clan’s seventh studio album, Once Upon a Time in Shaolin, was recorded in secret over six years, sealed in an ornate silver case, and first sold at a 2015 auction for a reported $2 million, under terms barring any commercial release until 2103. \u003C/p>\u003Cp>In the years since, the record - and the story of how it came to be - has become the stuff of legend for hip-hop fans. Now, a new documentary on the album’s unlikely origins and controversial reception sets out to tell that story. After making its world premiere at the 2026 Sundance Film Festival, The Disciple: A Wu-Tang Fable, from Academy Award–winning filmmaker Joanna Natasegara, will arrive on Netflix Oct. 16. \u003C/p>\u003Cp>The film follows Tarik Azzougarh - a Dutch-Moroccan Wu-Tang superfan performing as Cilvaringz - who talks his way into Wu-Tang Clan&#39;s inner circle and becomes the driving force behind the record at the center of the saga. What the MC and Wu-Tang set out to make was less an album than a provocation: a single, inimitable work of art conceived as a rebuke to a streaming era that had reduced music to disposable content - and built with full knowledge that it would court global controversy. Driving the project were two very different impulses: an appetite for a grand, potentially divisive gesture, and Wu-Tang Clan’s refusal to make anything less than a masterpiece. \u003C/p>\u003Cp>The documentary marks Natasegara’s (The White Helmets, The Edge of Democracy) feature directorial debut. Abigail Anketell-Jones, Lauren Dark, and Vanessa Kirby produce.\u003C/p>\u003Cp>\u003C/p>",{"__typename":9,"id":492,"fileName":493,"url":494},"cmuhf2pnr64fs07n31fwl86he","The Disciple 1280x770_SQ.jpg","https://us-west-2.graphassets.com/AjQ6YhqDQQuKSCpFHmA5az/cmuhf2pnr64ft07n3f1ghd40r","the-disciple-a-wu-tang-fable",{"__typename":54,"slug":55},"Ojai Playhouse - Films - The Disciple: A Wu-Tang Fable",{"__typename":36,"id":499,"title":459,"buyTicketsLink":500,"freeScreeningLink":40,"freeEventLink":40,"subtitle":40,"performerInformation":501,"livestreamLink":40,"eventDate":502,"additionalNotes":503,"eventInformation":504,"image":466,"slug":505,"eventCategory":506,"metaDescription":459,"metaTitle":472},"cmtau1xtn9y5v07k5p2wh8ye3","https://www.ticketweb.com/event/dr-brown-beturns-ojai-playhouse-tickets/14289834",{"__typename":21,"html":42},"2026-10-18T03:00:00+00:00",{"__typename":21,"html":464},{"__typename":21,"html":42},"dr-brown-beturns3",{"__typename":54,"slug":226},{"__typename":36,"id":508,"title":509,"buyTicketsLink":510,"freeScreeningLink":40,"freeEventLink":40,"subtitle":40,"performerInformation":511,"livestreamLink":40,"eventDate":512,"additionalNotes":513,"eventInformation":514,"image":516,"slug":520,"eventCategory":521,"metaDescription":509,"metaTitle":522},"cmsqigs9zai5l07n7qm98ecja","My Undesirable Friends: Part 1 - Last Air in Moscow (Chapters 4-5)","https://ticketing.uswest.veezi.com/purchase/1062?siteToken=0zv2d2xep31txszrx28cn3r0t4",{"__typename":21,"html":42},"2026-10-18T19:00:00+00:00",{"__typename":21,"html":425},{"__typename":21,"html":515},"\u003Cp>Year: 2024\u003Cbr>Director: Julia Loktev\u003Cbr>Starring: Olga Churakova, Irina Dolinina, Sonya Groysman\u003C/p>\u003Cp>chapter 4: The Expected Impossible (56min)\u003Cbr>chapter 5: Don’t Say War (1hr 9min)\u003C/p>\u003Cp>(2hr 5min)\u003C/p>\u003Cp>What begins as an intimate portrait of Russian independent journalists facing persecution by Putin’s regime takes a drastic turn when Russia starts a full-scale war in Ukraine and they are all forced into exile. The film offers a front row seat to how authoritarianism works and the lives of those who resist, which becomes all the more globally relevant every day.\u003C/p>\u003Cp>Soviet-born American filmmaker Julia Loktev (The Loneliest Planet, Day Night Day Night) came to Moscow in 2021 to make a film about independent journalists being declared “foreign agents” by Putin’s regime - as it turns out, just four months before Russia started a full-scale war in Ukraine. With her friend Anna Nemzer, a talk show host at TV Rain, Russia’s last remaining independent news channel, Loktev brings us into a community of sharp, warm and funny young women speaking truth to power as they face increasing threats. Loktev filmed in Moscow during the first week of the full-scale invasion, as the journalists tried to counter Russian propaganda and report the truth on the war, until all independent media was shut down and they were forced to flee the country. Structured in five chapters, feeling like a cross between a Russian novel and a reality show about frighteningly real reality, Loktev’s film is an extraordinary historic record of a country on the verge of fascism and an immersive and intimate inside view of the opposition in an authoritarian society, which becomes all the more globally relevant every day.\u003C/p>",{"__typename":9,"id":517,"fileName":518,"url":519},"cmsqfh8g67b0f07n76b7g7qrd","MUF 2 1280x770_SQ.jpg","https://us-west-2.graphassets.com/AjQ6YhqDQQuKSCpFHmA5az/cmsqfh8g67b0g07n7tif4x1sp","my-undesirable-friends-part-1-last-air-in-moscow-chapters-4-5",{"__typename":54,"slug":55},"Ojai Playhouse - Films - My Undesirable Friends: Part 1 - Last Air in Moscow (Chapters 4-5)",{"__typename":36,"id":524,"title":525,"buyTicketsLink":40,"freeScreeningLink":526,"freeEventLink":40,"subtitle":40,"performerInformation":527,"livestreamLink":40,"eventDate":528,"additionalNotes":529,"eventInformation":530,"image":532,"slug":536,"eventCategory":537,"metaDescription":525,"metaTitle":538},"cmu4nxiif0trx07lvw9qs223n","Take Me Home","https://www.eventbrite.com/e/2002084764425?aff=oddtdtcreator",{"__typename":21,"html":42},"2026-10-18T23:15:00+00:00",{"__typename":21,"html":81},{"__typename":21,"html":531},"\u003Cp>Year: 2026\u003Cbr>Director: Liz Sargent\u003Cbr>Starring: Steve Way, Ali Ahn, Shane Harper\u003Cbr>Running Time: 1hr 31min\u003C/p>\u003Cp>\u003Cstrong>Post screening Q&amp;A with director Liz Sargent and executive producer Janet Yang\u003C/strong>\u003C/p>\u003Cp>Anna (Anna Sargent making her acting debut), a middle-aged Korean adoptee with a cognitive disability, cares for her aging parents in a fragile balance of meeting one another’s needs. Alongside her sister Emily (Ali Ahn) and her father (Victor Slezak), they must confront challenging questions about the future, but Anna remains determined to build a life where all of them can thrive.\u003C/p>\u003Cp>Liz Sargent’s intimate debut drama examines the shifting demands placed on a unique - and uniquely challenged - family in a Florida suburb. Expanded from Sargent’s acclaimed short (2023 Sundance Film Festival), \u003Cem>Take Me Home\u003C/em> exposes the indignities of the American health care system and the structural challenges faced by disabled people. The film also gently and imaginatively traces a path for Anna’s independence and connection to a community of chosen family. \u003C/p>",{"__typename":9,"id":533,"fileName":534,"url":535},"cmu4nr1xl0lrl07lvlzvg59g6","Take Me Home 1280x770_SQ.jpg","https://us-west-2.graphassets.com/AjQ6YhqDQQuKSCpFHmA5az/cmu4nr1xl0lrm07lv0n5irb03","take-me-home",{"__typename":54,"slug":55},"Ojai Playhouse - Films - Take Me Home",{"__typename":36,"id":540,"title":541,"buyTicketsLink":542,"freeScreeningLink":40,"freeEventLink":40,"subtitle":40,"performerInformation":543,"livestreamLink":40,"eventDate":544,"additionalNotes":545,"eventInformation":547,"image":548,"slug":552,"eventCategory":553,"metaDescription":541,"metaTitle":555},"cmq6wq10923hi07mtf9zyhivt","John Moreland","https://www.ticketweb.com/event/john-moreland-ojai-playhouse-tickets/14970423",{"__typename":21,"html":42},"2026-10-24T03:00:00+00:00",{"__typename":21,"html":546},"\u003Cp>$40\u003C/p>",{"__typename":21,"html":42},{"__typename":9,"id":549,"fileName":550,"url":551},"cmq6wtq4q25aq07mt3xav4pfl","Moreland 1280x770_SQ.jpg","https://us-west-2.graphassets.com/AjQ6YhqDQQuKSCpFHmA5az/cmq6wtq4q25ar07mtlqnfbh09","john-moreland",{"__typename":54,"slug":554},"music","Ojai Playhouse - Music - John Moreland",{"__typename":36,"id":557,"title":558,"buyTicketsLink":559,"freeScreeningLink":40,"freeEventLink":40,"subtitle":40,"performerInformation":560,"livestreamLink":40,"eventDate":561,"additionalNotes":562,"eventInformation":563,"image":565,"slug":569,"eventCategory":570,"metaDescription":558,"metaTitle":571},"cmsqijugmatxl07n7crz6qx2o","My Undesirable Friends: Part 2 - Exile (Chapters 1-3)","https://ticketing.uswest.veezi.com/purchase/1063?siteToken=0zv2d2xep31txszrx28cn3r0t4",{"__typename":21,"html":42},"2026-10-25T19:00:00+00:00",{"__typename":21,"html":425},{"__typename":21,"html":564},"\u003Cp>Year: 2026\u003Cbr>Director: Julia Loktev\u003Cbr>Starring: Olga Churakova, Irina Dolinina, Sonya Groysman\u003C/p>\u003Cp>chapters 1-3: (3hr 11min)\u003C/p>\u003Cp>A community of young journalists are forced to flee when Russia turns telling the truth into a crime. As their country wages a criminal war they oppose, they must figure out how to keep working from exile, relying on friendship and dark humor to get through dark times.\u003C/p>\u003Cp>A group of young journalists flee Moscow when Russia invades Ukraine and shuts down all independent media, turning telling the truth into a crime. Just days before, they were working as part of a vibrant opposition community. Now they’re part of a historic exodus. They leave with a few hours’ notice, carry-on suitcases, and no idea what country they can go to next that will let them stay and keep working. They must quickly get back on their feet to report on the biggest story of their lives, a war they all fiercely oppose. Intimate and immersive, the film sweeps across four years and a dozen countries. The complex, razor sharp and often very funny women - and a few men - gather in apartments that feel like waystations and borrowed offices before being uprooted yet again. They work to bring Russians an alternative to propaganda, speaking out against their country’s war crimes and wrestling with personal moral accountability, even as Russia menaces them with criminal prosecution back home and physical threats abroad. Relying on dark humor to get through dark times, they keep working for the uncertain future of a country they may not return to for decades. As the years pass in exile, they have to redefine what work, family, friendship, love and home mean when you can’t go home.\u003C/p>",{"__typename":9,"id":566,"fileName":567,"url":568},"cmsqfh8i877li07n3kqrk94in","MUF 3 1280x770_SQ.jpg","https://us-west-2.graphassets.com/AjQ6YhqDQQuKSCpFHmA5az/cmsqfh8i877lj07n3ifpcujjf","my-undesirable-friends-part-2-exile-chapters-1-3",{"__typename":54,"slug":55},"Ojai Playhouse - Films - My Undesirable Friends: Part 2 - Exile (Chapters 1-3)",{"__typename":36,"id":573,"title":574,"buyTicketsLink":575,"freeScreeningLink":40,"freeEventLink":40,"subtitle":40,"performerInformation":576,"livestreamLink":40,"eventDate":577,"additionalNotes":578,"eventInformation":579,"image":581,"slug":585,"eventCategory":586,"metaDescription":574,"metaTitle":587},"cmsqimn3favi707n7liudrqh9","My Undesirable Friends: Part 2 - Exile (Chapters 4-5)","https://ticketing.uswest.veezi.com/purchase/1064?siteToken=0zv2d2xep31txszrx28cn3r0t4",{"__typename":21,"html":42},"2026-11-01T20:00:00+00:00",{"__typename":21,"html":425},{"__typename":21,"html":580},"\u003Cp>Year: 2026\u003Cbr>Director: Julia Loktev\u003Cbr>Starring: Olga Churakova, Irina Dolinina, Sonya Groysman\u003C/p>\u003Cp>chapters 4-5: (2hr 44min)\u003C/p>\u003Cp>A community of young journalists are forced to flee when Russia turns telling the truth into a crime. As their country wages a criminal war they oppose, they must figure out how to keep working from exile, relying on friendship and dark humor to get through dark times.\u003C/p>\u003Cp>A group of young journalists flee Moscow when Russia invades Ukraine and shuts down all independent media, turning telling the truth into a crime. Just days before, they were working as part of a vibrant opposition community. Now they’re part of a historic exodus. They leave with a few hours’ notice, carry-on suitcases, and no idea what country they can go to next that will let them stay and keep working. They must quickly get back on their feet to report on the biggest story of their lives, a war they all fiercely oppose. Intimate and immersive, the film sweeps across four years and a dozen countries. The complex, razor sharp and often very funny women - and a few men - gather in apartments that feel like waystations and borrowed offices before being uprooted yet again. They work to bring Russians an alternative to propaganda, speaking out against their country’s war crimes and wrestling with personal moral accountability, even as Russia menaces them with criminal prosecution back home and physical threats abroad. Relying on dark humor to get through dark times, they keep working for the uncertain future of a country they may not return to for decades. As the years pass in exile, they have to redefine what work, family, friendship, love and home mean when you can’t go home.\u003C/p>",{"__typename":9,"id":582,"fileName":583,"url":584},"cmsqfh8k777lp07n3vduegqju","MUF 4 1280x770_SQ.jpg","https://us-west-2.graphassets.com/AjQ6YhqDQQuKSCpFHmA5az/cmsqfh8k777lq07n357809cap","my-undesirable-friends-part-2-exile-chapters-4-5",{"__typename":54,"slug":55},"Ojai Playhouse - Films - My Undesirable Friends: Part 2 - Exile (Chapters 4-5)",{"__typename":36,"id":589,"title":590,"buyTicketsLink":591,"freeScreeningLink":40,"freeEventLink":40,"subtitle":40,"performerInformation":592,"livestreamLink":40,"eventDate":593,"additionalNotes":594,"eventInformation":596,"image":598,"slug":602,"eventCategory":603,"metaDescription":590,"metaTitle":604},"cmu7ccijgfbqj07lqnt7diraa","The Only Living Pickpocket in New York","https://www.ojaiplayhouse.com/events/all",{"__typename":21,"html":42},"2026-11-02T00:30:00+00:00",{"__typename":21,"html":595},"\u003Cp>$15/$13.50 (senior 60+)\u003C/p>\u003Cp>ON SALE SOON\u003C/p>",{"__typename":21,"html":597},"\u003Cp>ON SALE SOON\u003C/p>\u003Cp>Year: 2026\u003Cbr>Director: Noah Segan\u003Cbr>Starring: John Turturro, Giancarlo Esposito, Will Price, Steve Buscemi, Jamie Lee Curtis\u003Cbr>Running Time: 1hr 28min\u003C/p>\u003Cp>Harry Lehman (John Turturro) is an aging pickpocket who plies his trade with ever-diminishing returns in a drastically changed New York. Wallets stuffed with cash have been replaced by easily canceled credit cards, and Harry struggles to make ends meet as he cares for his disabled wife, Rosie. When he unwittingly purloins and fences a valuable USB stick, Harry finds himself in a race against time to return the loot or face the rage of a vengeful crime family.\u003C/p>",{"__typename":9,"id":599,"fileName":600,"url":601},"cmu7c9d6qfumu07mzntyxb44m","Pickpocket 1280x770_SQ.jpg","https://us-west-2.graphassets.com/AjQ6YhqDQQuKSCpFHmA5az/cmu7c9d6qfumv07mzafritg3o","the-only-living-pickpocket-in-new-york",{"__typename":54,"slug":55},"Ojai Playhouse - Films - The Only Living Pickpocket in New York",{"__typename":36,"id":606,"title":590,"buyTicketsLink":591,"freeScreeningLink":40,"freeEventLink":40,"subtitle":40,"performerInformation":607,"livestreamLink":40,"eventDate":608,"additionalNotes":609,"eventInformation":610,"image":611,"slug":615,"eventCategor
