<title>Playhouse Text Editor</title>
<style>
:root{--bg:#f4f2ee;--panel:#fff;--fg:#1c1b19;--muted:#6d685f;--line:#e2ddd3;--accent:#2f5fb3;--accent-fg:#fff;--chg:#b8650a;--chg-bg:#fff4e5;--ok:#1f8a4c;--pop:#7a3fb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#100f0e;--panel:#1a1917;--fg:#eeeae3;--muted:#9b958b;--line:#2e2c28;--accent:#8db2f5;--accent-fg:#101014;--chg:#f0a648;--chg-bg:#2c2114;--ok:#5fd08f;--pop:#c39bf0}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#100f0e;--panel:#1a1917;--fg:#eeeae3;--muted:#9b958b;--line:#2e2c28;--accent:#8db2f5;--accent-fg:#101014;--chg:#f0a648;--chg-bg:#2c2114;--ok:#5fd08f;--pop:#c39bf0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:52rem;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
header.bar{position:sticky;top:0;z-index:2;background:var(--bg);padding:16px 0 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.title{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:1.15rem;margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-weight:600;font-size:.9rem}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input{flex:1 1 14rem;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--fg);padding:6px 12px;font-size:.85rem}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.status{margin:0;font-size:.85rem;color:var(--muted);min-height:1.2em}
.status.ok{color:var(--ok)}
section{margin-top:22px}
section h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;gap:6px}
.item.changed{border-color:var(--chg);box-shadow:inset 3px 0 0 var(--chg)}
.head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.head b{font-size:.9rem}
.tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.tag.pop{color:var(--pop)}
.tag.chg{color:var(--chg);background:var(--chg-bg)}
.where{margin-left:auto;font:12px/1.3 ui-monospace,Menlo,monospace;color:var(--muted)}
textarea{width:100%;resize:vertical;min-height:2.4em;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit;line-height:1.4;field-sizing:content}
.foot{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.8rem;color:var(--muted)}
.foot code{font:12px ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.was{flex-basis:100%;color:var(--muted);font-size:.8rem}
.was s{text-decoration-color:var(--chg)}
.revert{margin-left:auto;border:0;background:none;color:var(--accent);font-size:.8rem;font-weight:600;padding:2px 0}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (max-width:520px){.where{margin-left:0;flex-basis:100%}}
</style>

<div class="wrap">
  <header class="bar">
    <div class="title">
      <div>
        <h1>Playhouse Text Editor</h1>
        <p class="sub">Edit the app's buttons, messages and pop-ups. Save, then ask Claude to "apply the saved text".</p>
      </div>
      <div class="actions">
        <button class="btn" id="copy">Copy changes</button>
        <button class="btn" id="reset">Reset all</button>
        <button class="btn primary" id="save" hidden>Save</button>
      </div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Find text…" aria-label="Find text">
      <div class="seg" role="group" aria-label="Show">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="pop" aria-pressed="false">Pop-ups</button>
        <button data-f="chg" aria-pressed="false">Changed <span id="n"></span></button>
      </div>
    </div>
    <p class="status" id="status" role="status"></p>
  </header>
  <main id="list"></main>
</div>

<script>

const ROWS = LIVE_ROWS.map(([id, screen, label, where, text, pop]) => ({ id, screen, label, where, text, pop: !!pop }));
const LIVE = Object.fromEntries(ROWS.map(r => [r.id, r.text]));

let s = { ...LIVE };
let filter = "all";
const $ = id => document.getElementById(id);
const status = (t, ok) => { $("status").textContent = t; $("status").className = "status" + (ok ? " ok" : ""); };
const changedIds = () => ROWS.filter(r => s[r.id] !== LIVE[r.id]).map(r => r.id);
const holes = t => (t.match(/\{\w+\}/g) || []).sort().join();

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

function build() {
  const list = $("list");
  list.textContent = "";
  let screen = null, sec = null;
  for (const r of ROWS) {
    if (r.screen !== screen) {
      screen = r.screen;
      sec = el("section", {}, el("h2", { textContent: screen }));
      list.append(sec);
    }
    const ta = el("textarea", { rows: 1, value: s[r.id], spellcheck: true });
    ta.setAttribute("aria-label", `${r.screen}: ${r.label}`);
    const was = el("div", { className: "was" });
    const warn = el("span", { style: "color:var(--chg)" });
    const revert = el("button", { className: "revert", textContent: "Undo" });
    const chgTag = el("span", { className: "tag chg", textContent: "Changed" });
    const ph = LIVE[r.id].match(/\{\w+\}/g);
    const foot = el("div", { className: "foot" },
      ph ? el("span", {}, "Filled in by the app: ", ...ph.flatMap((p, i) => [i ? " " : "", el("code", { textContent: p })])) : null,
      warn, revert, was);
    const item = el("div", { className: "item" },
      el("div", { className: "head" }, el("b", { textContent: r.label }),
        r.pop ? el("span", { className: "tag pop", textContent: "Pop-up / message" }) : null,
        chgTag, el("span", { className: "where", textContent: r.where })),
      ta, foot);
    item.dataset.id = r.id;
    item.dataset.pop = r.pop ? "1" : "";
    item.dataset.find = (r.screen + " " + r.label + " " + LIVE[r.id]).toLowerCase();
    const sync = () => {
      const c = s[r.id] !== LIVE[r.id];
      item.classList.toggle("changed", c);
      chgTag.hidden = !c; revert.hidden = !c; was.hidden = !c;
      was.textContent = ""; if (c) was.append("Live: ", el("s", { textContent: LIVE[r.id] }));
      warn.textContent = holes(s[r.id]) !== holes(LIVE[r.id]) ? "Check the {braces}: they should match the live text." : "";
    };
    ta.addEventListener("input", () => { s[r.id] = ta.value; sync(); refresh(); status(""); });
    revert.addEventListener("click", () => { s[r.id] = LIVE[r.id]; ta.value = s[r.id]; sync(); refresh(); ta.focus(); });
    item._sync = () => { ta.value = s[r.id]; sync(); };
    sync();
    sec.append(item);
  }
  list.append(el("p", { className: "empty", id: "empty", textContent: "Nothing matches.", hidden: true }));
  refresh();
}

function refresh() {
  const n = changedIds().length;
  $("n").textContent = n ? `(${n})` : "";
  const q = $("q").value.trim().toLowerCase();
  let shown = 0;
  for (const sec of $("list").querySelectorAll("section")) {
    let any = false;
    for (const item of sec.querySelectorAll(".item")) {
      const id = item.dataset.id;
      const ok = (filter === "all" || (filter === "pop" && item.dataset.pop) || (filter === "chg" && s[id] !== LIVE[id]))
        && (!q || item.dataset.find.includes(q) || s[id].toLowerCase().includes(q));
      item.hidden = !ok; if (ok) { any = true; shown++; }
    }
    sec.hidden = !any;
  }
  $("empty").hidden = shown > 0;
}

function syncAll() { for (const item of $("list").querySelectorAll(".item")) item._sync(); refresh(); }

$("q").addEventListener("input", refresh);
for (const b of document.querySelectorAll(".seg button")) b.addEventListener("click", () => {
  filter = b.dataset.f;
  for (const o of document.querySelectorAll(".seg button")) o.setAttribute("aria-pressed", o === b);
  refresh();
});
$("reset").addEventListener("click", () => { s = { ...LIVE }; syncAll(); status("Back to what's in the app now."); });
$("copy").addEventListener("click", async () => {
  const ids = changedIds();
  if (!ids.length) { status("Nothing changed yet."); return; }
  const out = Object.fromEntries(ids.map(id => [id, { from: LIVE[id], to: s[id] }]));
  try { await navigator.clipboard.writeText(JSON.stringify(out, null, 2)); status(`Copied ${ids.length} change${ids.length > 1 ? "s" : ""}. Paste it to Claude to apply.`, true); }
  catch { status("Couldn't copy here. Use Save instead."); }
});

build();

// Saved text lives in this page's database, where Claude reads it.
(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) return;
  const doc = db.doc(DOC);
  try {
    const snap = await doc.get();
    if (snap.exists) {
      const saved = snap.data()?.strings || {};
      for (const id in saved) if (id in LIVE && typeof saved[id] === "string") s[id] = saved[id];
      syncAll();
      const n = changedIds().length;
      if (n) status(`Loaded your last save: ${n} change${n > 1 ? "s" : ""} not in the app yet.`);
    }
  } catch {}
  $("save").hidden = false;
  $("save").addEventListener("click", async () => {
    $("save").disabled = true;
    const strings = Object.fromEntries(changedIds().map(id => [id, s[id]]));
    try { await doc.set({ strings, savedAt: new Date().toISOString() }); status("Saved. Ask Claude to apply the saved text.", true); }
    catch { status("Couldn't save. Try again in a moment, or use Copy changes."); }
    finally { $("save").disabled = false; }
  });
})();
</script>
