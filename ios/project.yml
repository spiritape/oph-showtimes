# The iOS app (docs/adr/0003). This file is the source of truth for the Xcode
# project: edit it, then run `xcodegen` in ios/ to regenerate Playhouse.xcodeproj.
name: Playhouse
options:
  bundleIdPrefix: com.ojaishowtimes
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # Tells Xcode the project already has its recommended settings (below), so
  # it stops offering to change them; change them here, not in Xcode.
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The Apple team that signs the app. It changes when the app moves to the Playhouse's account.
    DEVELOPMENT_TEAM: 5GL46QLKSS
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    # The build number shown in Settings and TestFlight. Raise it by one before
    # each TestFlight upload; App Store Connect refuses a number it has seen.
    CURRENT_PROJECT_VERSION: "10"
    # Xcode's recommended settings.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  Playhouse:
    type: application
    platform: iOS
    sources: [Playhouse, Shared]
    dependencies:
      - target: Widgets
      - target: NotificationService
    info:
      path: Playhouse/Info.plist
      properties:
        CFBundleURLTypes:
          # Links from the widgets: ojaiplayhouse://title/<slug>
          - CFBundleURLName: com.ojaishowtimes.app
            CFBundleURLSchemes: [ojaiplayhouse]
    entitlements:
      path: Playhouse/Playhouse.entitlements
      properties:
        # Shares the saved schedule with the widgets (re-register it after a transfer).
        com.apple.security.application-groups: [group.com.ojaishowtimes.app]
        # New Title Notifications. Xcode switches this to production when exporting for TestFlight.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ojaishowtimes.app
        PRODUCT_NAME: Playhouse
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Playhouse
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  Widgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Playhouse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ojaishowtimes.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ojaishowtimes.app.widgets
        PRODUCT_NAME: Widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
  NotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Playhouse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ojaishowtimes.app.notifications
        PRODUCT_NAME: NotificationService
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  PlayhouseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PlayhouseTests]
    dependencies:
      - target: Playhouse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Playhouse:
    build:
      targets:
        Playhouse: all
    test:
      targets: [PlayhouseTests]
